<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090b">
  <title>404 — 雪瑜</title>
  <link rel="icon" href="/assets/favicon.svg?v=4" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --mono: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: #f4eff3;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
      background:
        radial-gradient(60% 50% at 50% 62%, #5c2b5b8c, #0000 70%),
        radial-gradient(50% 40% at 50% 100%, #9d543f40, #0000 70%),
        #080708;
    }
    .tag {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px; border: 1px solid #ffffff24; border-radius: 999px;
      background: #ffffff0d; color: #d9cfd6; font: 600 11px/1 var(--mono); letter-spacing: .12em;
    }
    .tag i { width: 6px; height: 6px; border-radius: 50%; background: #ee8fd6; box-shadow: 0 0 10px #ee8fd6; }
    h1 { margin: 28px 0 10px; font: 800 clamp(72px, 18vw, 160px)/1 var(--mono); letter-spacing: -.04em; color: #f6f2f5; }
    h1 span { color: #ee8fd6; }
    p { margin: 0 auto 32px; max-width: 30em; color: #b9adb6; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center; min-width: 168px;
      padding: 13px 22px; border-radius: 999px; font-weight: 600; font-size: 14px; text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }
    a.btn:hover { transform: translateY(-2px); }
    a.btn:focus-visible { outline: 2px solid #ee8fd6; outline-offset: 3px; }
    .primary { background: #f4eff3; color: #120c11; }
    .ghost { border: 1px solid #ffffff2e; color: #f4eff3; background: #ffffff0a; }
    .ghost:hover { background: #ffffff14; }
  </style>
</head>
<body>
  <main>
    <span class="tag"><i></i> SIGNAL LOST</span>
    <h1>4<span>0</span>4</h1>
    <p>这个页面不存在，可能链接写错了，或者内容已经搬走。<br>This page doesn’t exist.</p>
    <div class="actions">
      <a class="btn primary" href="/">回到首页</a>
      <a class="btn ghost" href="/#work">查看作品</a>
    </div>
  </main>
</body>
</html>
