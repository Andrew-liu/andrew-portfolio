name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export native Rec.2100 PQ ICC
        run: swift tools/hdr-avatar/scripts/color-profile.swift tools/hdr-avatar/rec2100-pq.icc

      - name: Verify HDR PNG encoding
        run: node tools/hdr-avatar/verify.mjs tools/hdr-avatar/rec2100-pq.icc "$RUNNER_TEMP/hdr-avatar-check.png"

      - name: Verify HDR decoding with CoreImage
        run: swift tools/hdr-avatar/scripts/color-profile.swift tools/hdr-avatar/rec2100-pq.icc "$RUNNER_TEMP/hdr-avatar-check.png"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
